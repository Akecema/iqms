; Azure App Service (Linux, native PHP runtime) PHP-FPM config.
;
; App Service's Deployment Center pipeline (.github/workflows/main_iqms.yml)
; deploys raw PHP files directly under App Service's own PHP-FPM runtime — it
; does not build or run a Dockerfile even if one exists in the repo. PHP-FPM
; on App Service DOES read a .user.ini file placed at the docroot (applies to
; this directory and every subdirectory PHP executes from), which is the only
; way to apply these settings without a custom startup script. Same pattern
; as i-CHARM and mrin_online (see the shared PHP Migration Playbook).

; Auto-prepend the PHP7->8 mysqli compat shim.
; Must be an absolute path — App Service's docroot is /home/site/wwwroot.
auto_prepend_file = /home/site/wwwroot/bootstrap-php8-compat.php

; Several pages (index.php's login form, system-header.php, etc.) print HTML
; before calling session_start()/header('Location: ...'). That only works if
; PHP buffers output so headers aren't flushed yet when those calls happen.
; Traditional shared/cPanel hosting (which this app was built against) has
; this on by default; App Service's stock PHP runtime does not. Spot-check
; on index.php/login-process.php found correct ordering already, but this is
; kept as defensive insurance against any other module file with the same
; pattern (see the shared PHP Migration Playbook's "blank page after login"
; entry).
output_buffering = 4096

; Suppress deprecation/notice noise from rendered output; still captured by
; App Service's own logging (visible in the log stream either way).
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
display_errors = Off

; The app does move_uploaded_file() for inspection photo uploads (see
; pages/gallery/); sized the same as i-CHARM's proven values pending an
; exact call-site count.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 120
